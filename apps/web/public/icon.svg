<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="#3b82f6" opacity="0.12" filter="blur(32px)"/>

  <!-- Stylized Shield / Chip Container -->
  <path d="M256 96 L396 156 V276 C396 356 332 416 256 440 C180 416 116 356 116 276 V156 Z" 
        fill="#1e1e24" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inside Tech Circuit Lines -->
  <path d="M256 170 V220 M256 290 V340 M196 256 H230 M282 256 H316" 
        stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="196" cy="256" r="8" fill="#60a5fa"/>
  <circle cx="316" cy="256" r="8" fill="#60a5fa"/>
  <circle cx="256" cy="170" r="8" fill="#60a5fa"/>
  <circle cx="256" cy="340" r="8" fill="#60a5fa"/>

  <!-- Central Emblem "G" -->
  <rect x="232" y="232" width="48" height="48" rx="10" fill="url(#primaryGrad)"/>
  <text x="256" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle">G</text>
</svg>
